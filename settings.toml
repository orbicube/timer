[timer]
# How long to run the timer for, and how much will be added with the "add" command
seconds = 1800
# Whether to convert times > 60 minutes into hours
hours = true
# Whether to resume the timer from current.txt on launch
resume = false
# Whether to display the timer in beats
# If this is true then the hours setting will be ignored
beats = false
# Whether to convert seconds into beats
# If the above is true and this is true, added seconds will be converted into beats
# If above is true and this is false, seconds will be treated as centibeats
convert = true
# Dictionary of custom values that program recognises
# It will look for text files with the given names and then add time based on number inside
# e.g. dollar containing 2.50 will add 150 seconds
values = { dollar = 60.0, bit = 0.6, sub = 300.0, tier2 = 600.0, tier3 = 1500.0, prime = 180.0 }
# If true, will look for value in second line of custom value and use it as a multiplier
multiplier = true

[font]
 # Font name installed on the system
name = "Arial"
# Font size, too large may crash; Arial can go up to 340 whereas Comic Sans MS is good up to 270 
size = 250
# RGB integer array for colour to use while counting down
color = [255, 255, 255]
# RGB integer array for colour to use while inactive
inactive_color = [196, 196, 196]

[alarm]
enabled = true
file = "alarm.wav"
volume = 1.0

[window]
# Whether the window should be transparent
transparent = false
# If above is false, the color to use
bg_color = [255, 0, 255]